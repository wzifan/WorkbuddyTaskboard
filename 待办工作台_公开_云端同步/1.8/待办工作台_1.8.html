<title>待办工作台（云端同步版）</title>
<style>
:root{
  --bg:#f2f4f8;--card:#fff;--line:#e5e8ee;--text:#1c2330;--muted:#6f7886;--faint:#a3aab6;
  --accent:#2f6fed;--accent-bg:#e6eeff;--danger:#e0484f;
  --work:#2f6fed;--work-bg:#dde8ff;--work-tx:#1b4bc0;--work-bg2:#ecf1fe;
  --study:#8b5cf6;--study-bg:#e9e3ff;--study-tx:#5f2fd0;--study-bg2:#f2eefe;
  --life:#12a06c;--life-bg:#d6f2e5;--life-tx:#0a7a50;--life-bg2:#e9f7f0;
  --rest:#7b8494;--rest-tx:#4b5563;
  --void:#3fae72;--void-bg:#d9f3e4;--void-bg2:#ebf8f0;--void-tx:#2f8a5a;
  --off-bg:#fbf6ee;--cell-bg:#f7f8fb;
  --slot-h:22px;--radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 10px 28px -14px rgba(16,24,40,.14);
}
*{box-sizing:border-box}
html{height:100%;overflow-anchor:none}
body,.panel-body{overflow-anchor:none}
body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}
svg{display:inline-block;vertical-align:middle}

/* ---------- top bar ---------- */
.top{height:52px;display:flex;align-items:center;gap:16px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--work),var(--study) 60%,var(--life));display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 6px -2px rgba(47,111,237,.45)}
.brand .logo svg{width:17px;height:17px;display:block}
.brand-txt-m{display:none}
.stats{color:var(--muted);font-size:13px;display:flex;gap:14px;margin-left:auto;white-space:nowrap}
.stats b{color:var(--text);font-weight:600}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(540px,.9fr);gap:16px;padding:16px 20px;height:calc(100vh - 52px)}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;min-width:0}
.panel-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:52px}
.panel-body{flex:1;min-height:0;overflow:auto;padding:12px 16px 16px;-webkit-overflow-scrolling:touch}

.icon-btn{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.icon-btn:hover{background:#f1f3f7;color:var(--text)}
.chip-btn{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--muted);background:#fff}
.chip-btn:hover{border-color:#cdd3dd;color:var(--text)}
.cal-title{font-size:16px;font-weight:700;min-width:104px;text-align:center;letter-spacing:.2px}
.cal-head{position:relative;z-index:20;column-gap:10px;row-gap:9px}   /* 跨行恢复紧凑间距；横向三按钮仍保持放大后的等间距；说明浮层要盖住下面的日历 */
.cal-actions{display:inline-flex;align-items:center;gap:10px;flex:none;margin-left:6px}   /* 未换行时三个按钮的视觉间距约为 16px */
.cal-info-btn{width:28px;height:28px;border:0;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:transparent;color:var(--faint)}
.cal-info-btn svg{width:17px;height:17px;display:block}
.cal-info-letter{fill:currentColor;stroke:none;font-family:"Palatino Linotype",Georgia,"Times New Roman",serif;font-size:14px;font-weight:700;font-style:italic}
.cal-info-btn:focus-visible,.cal-info-btn.is-open{background:#f1f3f7;color:var(--muted)}
.cal-info-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cal-info-tip{position:absolute;left:50%;top:calc(100% + 6px);z-index:30;width:max-content;max-width:calc(100% - 32px);padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);box-shadow:0 8px 24px -10px rgba(16,24,40,.32);font-size:12px;line-height:1.5;text-align:left;white-space:normal;opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-3px);transition:opacity .12s ease,transform .12s ease,visibility .12s}
@media (hover:hover) and (pointer:fine){
  .cal-info-btn:hover{background:#f1f3f7;color:var(--muted)}
  .cal-info-btn:hover + .cal-info-tip,.cal-info-btn:focus-visible + .cal-info-tip{opacity:1;visibility:visible;transform:translate(-50%,0)}
}
.cal-info-btn.is-open + .cal-info-tip{opacity:1;visibility:visible;transform:translate(-50%,0)}
.legend{margin-left:auto;display:flex;gap:10px;font-size:12px;color:var(--muted);flex:none;flex-wrap:nowrap;white-space:nowrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.legend i.rest-i{background:repeating-linear-gradient(135deg,#cfd5de 0 2px,#eef0f4 2px 4px)}
.legend i.void-i{background:var(--void-bg2);border:1px solid var(--void-bg)}
.chip-btn.attn{border-color:var(--accent);color:var(--accent)}

/* ---------- calendar ---------- */
.weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:4px}
.weekdays div{text-align:center;font-size:12px;color:var(--muted);padding:2px 0 4px}
.weekdays div.we{color:#c2554f}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;touch-action:pan-y pinch-zoom}   /* 触屏左右滑动切换月份，上下仍可滚动 */
.day{background:var(--cell-bg);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:3px;border:1.5px solid transparent;min-width:0}
.day.off{background:var(--off-bg)}
.day.other{opacity:.45}
.day.today{border-color:color-mix(in srgb,var(--accent) 82%,#fff);background:#fff}   /* 当天边框：比主色略浅 */
.dhead{display:flex;align-items:center;gap:3px;height:20px;min-width:0}
.num{width:20px;height:20px;line-height:20px;border-radius:999px;text-align:center;font-size:12px;font-weight:600;flex:none;color:var(--text)}
.num:hover{box-shadow:0 0 0 2px var(--accent-bg)}
.day.off .num{color:#c2554f}
.day.today .num{background:color-mix(in srgb,var(--accent) 94%,#fff);color:#fff}
.day.pastday .num{color:var(--faint)}
.badge{font-size:9px;line-height:14px;padding:0 3px;border-radius:4px;flex:none;font-weight:700}
.badge.off{background:#fde3e1;color:#c2554f}
.badge.work{background:var(--work-bg);color:var(--work-tx)}
.fest{font-size:10px;color:#c2554f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.rows{display:grid;grid-template-rows:repeat(3,var(--slot-h));gap:2px;position:relative}
.rows svg.dsvg,.rows svg.fsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:2}
.rows svg.dsvg path{fill:none;stroke-width:1.5;stroke-opacity:.62;stroke-dasharray:3 2.5;stroke-linecap:round}
.rows svg.fsvg path{fill:none;stroke-linejoin:round;animation:fpulse .8s ease-out 2}   /* 从列表定位到日历：沿整体形状向外扩散一圈 */
@keyframes fpulse{0%{stroke-width:1.5;stroke-opacity:.95}100%{stroke-width:9;stroke-opacity:0}}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px;min-width:0}
.row.full{grid-template-columns:minmax(0,1fr)}
.blk{--r:6px;--g:2px;height:var(--slot-h);border-radius:var(--r);font-size:10.5px;line-height:var(--slot-h);padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative;text-align:center}
.blk svg{width:10px;height:10px;margin-right:2px;vertical-align:-1px}
.blk.empty{background:rgba(255,255,255,.75)}
.blk.empty.work{background:#edf2fd}
.day.today .blk.empty{background:#f3f5f9}
.day.today .blk.empty.work{background:#e9effc}
.blk.past{background:repeating-linear-gradient(135deg,#eceef2 0 3px,transparent 3px 7px)}
.day.pastday .blk.past{background:transparent}
.blk.item{cursor:grab;font-weight:500}
.blk.item.hov{filter:brightness(.94) saturate(1.2)}   /* hover：同一待办的所有块一起轻微加深，不用虚线 */
.blk.cat-work{--bc:var(--work-bg);background:var(--bc);color:var(--work-tx)}
.blk.cat-study{--bc:var(--study-bg);background:var(--bc);color:var(--study-tx)}
.blk.cat-life{--bc:var(--life-bg);background:var(--bc);color:var(--life-tx)}
.blk.rest{--bc:#ebeef2;background:repeating-linear-gradient(135deg,#e6e9ee 0 5px,#f2f4f7 5px 10px);color:var(--rest-tx)}
/* 「空」：为有时间要求的待办留出的空档。样式同原「其他」（更浅底色 + 更淡文字），换成绿色；不可拖动，其他待办可以直接落在上面 */
.blk.item.void{--bc:var(--void-bg2);background:var(--bc);color:color-mix(in srgb,var(--void-tx) 70%,#fff);font-weight:400;cursor:pointer}
.blk.item.void svg{margin-right:0}
.blk.item.fixed{cursor:pointer}   /* 固定时间的待办不能拖动 */
.blk.item.ago{opacity:.55}   /* 进行中待办已经过去的部分 */
/* 同一待办在一天内跨行时合成一体：
   tl/tr/bl/br = 该角与本待办的上/下一块相接，取直角；xu/xd = 由较窄的一块把行间隙补上；
   fl/fr = 台阶拐角处的内圆角（半径 = 外圆角 + 间隙，与相邻待办的圆角同心，间隙处处等宽） */
.blk.tl{border-top-left-radius:0}.blk.tr{border-top-right-radius:0}.blk.bl{border-bottom-left-radius:0}.blk.br{border-bottom-right-radius:0}
.blk.xu{margin-top:calc(-1 * var(--g));height:calc(var(--slot-h) + var(--g));padding-top:var(--g)}
.blk.xd{height:calc(var(--slot-h) + var(--g))}
.blk.fl,.blk.fr{overflow:visible}
.blk.fl::after,.blk.fr::after{content:"";position:absolute;width:calc(var(--r) + var(--g));height:calc(var(--r) + var(--g));pointer-events:none}
.blk.fr::after{left:100%;top:0;background:radial-gradient(circle at 100% 100%,transparent calc(var(--r) + var(--g) - .6px),var(--bc) calc(var(--r) + var(--g)))}
.blk.fl::after{right:100%;bottom:0;background:radial-gradient(circle at 0 0,transparent calc(var(--r) + var(--g) - .6px),var(--bc) calc(var(--r) + var(--g)))}
.blk .btx{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.blk.drag-src{opacity:.35}   /* 拖动中的占位：整块变淡，虚线轮廓由 .dsvg 沿合并后的整体形状绘制 */
.cal-hint{margin:12px 2px 0;font-size:11.5px;line-height:1.6;color:var(--faint);text-align:center}
.cal-hint + .cal-hint{margin-top:3px}
.cal-hint.warn{color:#c8302f}   /* 公开版：隐私提醒，红字 */

/* ---------- list panel ---------- */
.seg{display:inline-flex;background:#f1f3f7;border-radius:9px;padding:3px}
.seg button{height:26px;padding:0 12px;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.head-note{margin-left:auto;font-size:12px;line-height:16px;color:var(--faint);min-width:0;flex:0 1 auto;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;white-space:normal;overflow-wrap:break-word;text-wrap:balance;text-align:right}   /* 始终在切换条右侧；最多 2 行，超出自动在末尾省略号（配合 hn-clip 可悬停/点按看全文）；balance 负责按标点/均分折行，text-align:right 让整块（含双行）右缘对齐；窄屏（<345px）11px/3 行，见下方媒体查询 */
.head-note.hn-multi{padding-right:5px}   /* ≥2 行时右缘多留 5px 呼吸位（由 boot 段的 ResizeObserver 按实际行数切换，单行自动还原） */
.hn-tip{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:max-content;max-width:260px;max-width:min(260px, calc(100vw - 32px));padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);box-shadow:0 8px 24px -10px rgba(16,24,40,.32);font-size:12px;line-height:1.5;text-align:left;white-space:normal;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-3px);transition:opacity .12s ease,transform .12s ease,visibility .12s}   /* max-width 双写：旧浏览器取 260px，新浏览器同时受页面宽度约束（窄屏不溢出） */
@media (hover:hover) and (pointer:fine){
  .head-note.hn-clip:hover + .hn-tip{opacity:1;visibility:visible;transform:translateY(0);transition-delay:.5s}   /* 桌面悬停显示完整文案（仅截断时；悬停满 0.5 秒才显示、未满移开不显示；同信息按钮 i） */
}
.head-note.is-open + .hn-tip{opacity:1;visibility:visible;transform:translateY(0)}   /* 手机点一下钉住显示，再点一下或点旁边取消 */
#listPanel .panel-head{position:relative}   /* 供 hn-tip 绝对定位锚定；≤1260 的吸顶由后面的同名媒体规则覆盖回来 */
#listPanel .panel-head{flex-wrap:nowrap;height:52px}   /* 列表面板不把提示语折到下一行，两行时也不撑高头部 */
#listPanel .seg{flex:none}
@media (max-width:344px){
  .head-note{font-size:11px;line-height:14px;-webkit-line-clamp:3}   /* 窄屏提示语：缩到 11px、行距略减（16→14）、允许 3 行（超出自动省略号） */
  #listPanel .panel-head{height:auto;min-height:52px}   /* 3 行时允许头部自然撑高（不再钉死 52px；放在原规则之后以生效） */
}

.quick{display:flex;gap:6px;margin-bottom:14px}
.quick select{height:34px;border:1px solid var(--line);border-radius:9px;padding:0 6px;background:#fff;color:var(--muted);max-width:38%;min-width:0}
.quick input{flex:1;height:34px;border:1px solid var(--line);border-radius:9px;padding:0 10px;min-width:0;background:#fff}
.quick input:focus,.addrow input:focus,.inline-edit:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.btn{height:34px;padding:0 14px;border-radius:9px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.day-sep{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:16px 0 6px;font-weight:600}
.sched-section>.day-sep:first-child{margin-top:0}
.day-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.day-sep.today{color:var(--accent)}
.sec-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin:20px 0 8px}
.sec-h .cnt{font-weight:500;color:var(--faint)}
.sp{flex:1}
.sec-h button{font-size:12px;color:var(--accent);font-weight:500;padding:2px 6px;border-radius:6px}
.sec-h button:hover{background:var(--accent-bg)}
.empty-hint{color:var(--faint);font-size:13px;padding:16px 12px;text-align:center;border:1px dashed var(--line);border-radius:11px;line-height:1.6}

/* ---------- todo row ---------- */
.todo{display:grid;grid-template-columns:24px minmax(0,1fr) auto 28px;grid-template-areas:"c b k m";align-items:center;gap:6px;padding:6px 6px 6px 10px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:11px;background:#fff;border:1px solid var(--line);margin-bottom:8px;position:relative;--c:var(--muted)}
.todo::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.todo.cat-work{--c:var(--work)}.todo.cat-study{--c:var(--study)}.todo.cat-life{--c:var(--life)}
.todo.rest{background:repeating-linear-gradient(135deg,#fbfcfd 0 8px,#f2f4f7 8px 16px)}
.todo.rest .title{color:var(--rest-tx)}
/* 「空」：样式同原「其他」（标题灰字 + 类别色图标，其余与普通待办一致），换成绿色；勾选、加减、排期、上下移都不可用，⋯ 里可转为普通待办 */
.todo.void{--c:var(--void)}
.todo.void .title{color:var(--muted);cursor:default}
.todo.void .title svg{color:var(--c)}
.todo.void .trow{cursor:default}
.todo.void .trow:hover{background:none}
.todo.void .check{cursor:not-allowed;background:#f2f4f7;border-color:#dfe3e9}   /* 灰底浅框：一看就是点不了的 */
.todo.void .check:hover{border-color:#dfe3e9}
.todo.void .est button:disabled{color:#d3d8e0;cursor:default;background:none}
.todo.void .est .val{cursor:default}
.todo.void .sw:disabled{cursor:default;opacity:.4}
.req{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 9%,#fff);border-radius:5px;padding:0 5px;line-height:17px;font-size:11px}
.req svg{width:11px;height:11px}
.when.warn{color:var(--danger);font-weight:500;cursor:default;white-space:normal}
.when.warn:hover{background:none}
.sec-h.warn{color:var(--danger)}
.stuck{margin-bottom:14px}
.stuck .sec-h{margin-top:0}
.stats .warn,.stats .warn b{color:var(--danger)}
.todo.done{opacity:.62}
.todo.done .title{text-decoration:line-through;color:var(--muted)}
.todo.drag-src{opacity:.4;background:#f6f8fb;outline:2px dashed #c9d2e0;outline-offset:-2px}
.todo input{user-select:text;-webkit-user-select:text}
.todo.pressing{background:#f3f5f9}   /* 长按等待中的反馈 */
.check{grid-area:c;width:20px;height:20px;border-radius:6px;border:1.5px solid #c3c9d3;display:flex;align-items:center;justify-content:center;color:#fff;background:#fff}
.check:hover{border-color:var(--c)}
.check.on{background:var(--c);border-color:var(--c)}
.check svg{width:12px;height:12px;opacity:0}
.check.on svg{opacity:1}
.body{grid-area:b;min-width:0}
.title{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;padding:1px 4px;margin:-1px -4px;border-radius:5px}
.title svg{width:13px;height:13px;vertical-align:-2px;margin-right:3px;color:var(--rest)}
.meta{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:2px;flex-wrap:wrap;min-width:0}
.tag{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:2px;background:var(--c);display:inline-block}
.when{color:var(--c);font-weight:500;cursor:pointer;white-space:nowrap;padding:0 4px;margin:0 -4px;border-radius:4px}
.when:hover{background:#f1f3f7}
.abbr{color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.segno{display:inline-block;margin-left:6px;padding:0 5px;border-radius:5px;background:var(--accent-bg);color:var(--accent);font-size:10.5px;font-weight:600;line-height:16px;vertical-align:1px}
.rowbtns{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;height:26px;overflow:hidden;background:#fff}
.rowbtns button{width:26px;height:26px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.rowbtns button+button{border-left:1px solid var(--line)}
.rowbtns button:hover{background:#f1f3f7;color:var(--text)}
.rowbtns button:disabled{color:#d3d8e0;cursor:default;background:none}
.rowbtns svg{width:14px;height:14px}
.ctrls{grid-area:k;display:flex;align-items:center;gap:6px}   /* gap=组内按钮横向距离，即两组最小距离 */
.ctrls::before{content:'';order:2;flex:1 1 auto;min-width:0}   /* 弹性撑开两组间距：宽度够就拉开，不够缩为 0（即最小距离） */
.ctrls .est,.ctrls .sw,.ctrls .arch-btn{order:1}
.ctrls .rowbtns{order:3}   /* 上下移一组始终靠右；换行时落到下一行最左 */
.est{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;height:26px;overflow:hidden;background:#fff}
.est button{width:24px;height:26px;color:var(--muted);font-size:15px;display:flex;align-items:center;justify-content:center}   /* flex 视觉垂直居中 */
.est button svg{width:14px;height:14px;display:block}   /* 列表预估与属性里的已完成共用同一套图标尺寸 */
#dlgDnRow .est{align-self:flex-start}   /* 不要被弹窗列宽拉成一整条，保持和列表里的预估按钮一样宽 */
#dlgDnRow.locked .est{background:#f7f8fa;border-color:#e6eaf1}   /* 固定开始已过去：已完成随日期自动，控件锁定 */
#dlgDnRow.locked .est button,#dlgDnRow.locked .est button:hover{color:#c9d0dc;background:none;cursor:default}
#dlgDnRow.locked #dlgDnVal{cursor:default}
.est button:hover{background:#f1f3f7;color:var(--text)}
.est .val{min-width:32px;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;cursor:text}   /* 数字 flex 垂直居中，点击可直接输入 */
.est .val.empty{color:var(--faint)}
.est .val small{font-size:9px;color:var(--faint);margin-left:1px;position:relative;top:1.5px}   /* 单位在居中基础上下移，自然偏下 */
.sw{height:26px;padding:0 8px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;background:#fff;white-space:nowrap}
.sw svg{width:12px;height:12px}
.sw:hover{border-color:var(--c);color:var(--c)}
.sw.on{background:var(--c);border-color:var(--c);color:#fff}
.more{grid-area:m;width:28px;height:28px;border-radius:8px;color:var(--faint);display:flex;align-items:center;justify-content:center}
.more:hover{background:#f1f3f7;color:var(--text)}
.more.menu-open{background:#e9edf3;color:var(--text)}   /* 菜单展开时 ⋯ 保持高亮，暗示再点一次可收起 */
.arch-btn{height:26px;padding:0 8px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;background:#fff;white-space:nowrap}
.arch-btn svg{width:12px;height:12px}
.arch-btn:hover{border-color:var(--c);color:var(--c)}
.inline-edit{width:100%;min-width:0;height:26px;border:1px solid var(--accent);border-radius:6px;padding:0 6px;font-size:14px;background:#fff}
.inline-edit.g{font-weight:600;font-size:13.5px}

/* ---------- group view ---------- */
.cat{margin-bottom:20px}
.cat-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cat-h .dot{width:10px;height:10px;border-radius:3px;background:var(--c)}
.cat-h h3{margin:0;font-size:15px}
.cat-h .cnt{font-size:12px;color:var(--faint)}
.cat.cat-work{--c:var(--work)}.cat.cat-study{--c:var(--study)}.cat.cat-life{--c:var(--life)}
.group{border:1px solid var(--line);border-radius:12px;padding:4px 8px 8px;margin-bottom:8px;background:#fff}
.group.drag-src{opacity:.4;outline:2px dashed #c9d2e0;outline-offset:-2px}
.g-h{display:flex;align-items:center;gap:4px;height:34px;min-width:0;border-radius:8px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.g-h input{user-select:text;-webkit-user-select:text}
.g-h.pressing{background:#f3f5f9}   /* 长按等待中的反馈 */
.g-fold{width:20px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--faint);border-radius:6px;flex:none}
.g-fold:hover{color:var(--muted);background:#f1f3f7}
.g-fold svg{transition:transform .15s}
.g-fold.folded svg{transform:rotate(-90deg)}
.gname{font-weight:600;font-size:13.5px;cursor:text;padding:2px 6px;margin:-2px 0;border-radius:5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gname:hover{background:#f4f6fa}
.g-h .cnt{font-size:12px;color:var(--faint);white-space:nowrap}
.group .todo{margin-bottom:4px;border-color:#eef1f5;background:#fafbfd}
.group .todo.rest{background:repeating-linear-gradient(135deg,#fbfcfd 0 8px,#f2f4f7 8px 16px)}
.addrow{display:flex;gap:6px;margin-top:4px}
.addrow input{flex:1;height:30px;border:1px solid transparent;background:#f4f6fa;border-radius:8px;padding:0 10px;min-width:0;font-size:13px}
.addrow input:focus{background:#fff}
.addrow button{height:30px;padding:0 10px;border-radius:8px;background:#f1f3f7;font-size:12px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.addrow button svg{width:11px;height:11px}
.addrow button:hover{color:var(--text);background:#e6eaf0}
.addrow button.primary{background:var(--accent);color:#fff}
.add-group{width:100%;height:34px;border:1px dashed #cfd6e0;border-radius:11px;color:var(--muted);font-size:13px}
.add-group:hover{border-color:var(--accent);color:var(--accent)}
.archived{margin-top:22px;border-top:1px solid var(--line);padding-top:10px}
.archived>summary{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;list-style:none;padding:4px 0}
.archived>summary::-webkit-details-marker{display:none}
.arch-top-caret,.arch-caret{display:inline-flex;align-items:center;justify-content:center;flex:none}
.arch-top-caret{width:16px;height:16px;color:var(--faint)}
.arch-top-caret svg,.arch-caret svg{display:block;transition:transform .16s;transform-origin:center}
.arch-top-caret svg{width:12px;height:12px}
.archived:not([open])>summary .arch-top-caret svg{transform:rotate(-90deg)}
.archived:not([open])>:not(summary),.arch-cat:not([open])>:not(summary),.arch-grp:not([open])>:not(summary){display:none}
.archived summary button{font-size:12px;color:var(--faint);padding:2px 6px;border-radius:6px}
.archived summary button:hover{color:var(--danger);background:#fdeeee}
.arch-cat{margin-top:10px}
.arch-cat>summary,.arch-grp>summary{display:flex;align-items:center;cursor:pointer;list-style:none}
.arch-cat>summary::-webkit-details-marker,.arch-grp>summary::-webkit-details-marker{display:none}
.arch-cat>summary{gap:8px;min-height:36px;padding:0 8px;border-radius:10px;font-size:13.5px;font-weight:600}
@media (hover:hover) and (pointer:fine){
  .arch-cat>summary:hover{background:var(--cbg)}
}
.arch-caret{width:20px;height:20px;border-radius:7px;background:var(--cbg);color:var(--c)}
.arch-caret svg{width:13px;height:13px}
.arch-cat:not([open])>summary .arch-caret svg{transform:rotate(-90deg)}
.arch-cat>summary .dot{width:8px;height:8px;border-radius:3px;background:var(--c);flex:none}
.arch-cat>summary .cnt{font-size:11px;font-weight:600;line-height:16px;color:var(--c);background:var(--cbg);border-radius:99px;padding:0 7px}
.arch-cat.cat-work{--c:var(--work);--cbg:var(--work-bg)}.arch-cat.cat-study{--c:var(--study);--cbg:var(--study-bg)}.arch-cat.cat-life{--c:var(--life);--cbg:var(--life-bg)}
.arch-grp{margin:12px 0 2px 14px;padding-left:12px;border-left:1px solid #e4e9f1}
.arch-grp>summary{gap:5px;min-height:30px;padding:0 6px;border-radius:8px;font-size:12.5px;font-weight:600;color:#5c6778}
@media (hover:hover) and (pointer:fine){
  .arch-grp>summary:hover{background:#f3f5f8}
}
html.coarse .arch-cat>summary:hover,html.coarse .arch-grp>summary:hover,
html.coarse .arch-cat>summary:active,html.coarse .arch-grp>summary:active{background:transparent}
html.coarse .arch-cat>summary.is-pressed{background:var(--cbg)}
html.coarse .arch-grp>summary.is-pressed{background:#f3f5f8}
html.coarse .est button{-webkit-tap-highlight-color:transparent}
html.coarse .est button:hover,html.coarse .est button:active{background:transparent;color:var(--muted)}
html.coarse .est button.is-pressed{background:#f1f3f7;color:var(--text)}
html.coarse .est button:disabled,html.coarse .est button:disabled.is-pressed{background:none;color:#d3d8e0}
.arch-grp .arch-caret{width:14px;height:14px;border-radius:0;background:none;color:#9aa3b2}
.arch-grp .arch-caret svg{width:11px;height:11px}
.arch-grp:not([open])>summary .arch-caret svg{transform:rotate(-90deg)}
.arch-grp>summary .cnt{font-size:11px;font-weight:500;color:var(--faint)}
.arch-grp .arch-item{padding-left:8px}
.arch-item{display:flex;align-items:center;gap:10px;padding:7px 8px;font-size:13px;color:var(--muted);border-radius:8px}
.arch-item:hover{background:#f6f8fb}
.arch-item.pressing{background:#edf2fa}
.arch-item.drag-src{opacity:.35;outline:2px dashed #c9d2e0;outline-offset:-2px}
.ghost-archive .arch-item{background:#fff;border:1px solid var(--line);border-radius:8px}
.arch-item .arch-title{flex:1;cursor:text;text-decoration:line-through;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.arch-item .arch-title:hover{color:var(--text)}
.arch-item>.inline-edit{flex:1;width:auto;min-width:0}
.arch-item .cnt{font-size:11px;color:var(--faint);white-space:nowrap}
.arch-ops{margin-left:auto;display:inline-flex;align-items:center;gap:8px;flex:none}
.arch-item button{margin-left:0;font-size:12px;color:var(--accent);white-space:nowrap}
.arch-item button.arch-move{width:32px;height:24px;margin:0;padding:0;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:#6d7c90;background:transparent;flex:none}
.arch-item button.arch-move svg{width:22px;height:auto;display:block}
.arch-item button.arch-move:hover{background:#e7eefb;color:var(--accent)}
.arch-item button.arch-move.menu-open{background:#dce7fb;color:var(--accent)}
.move-tip{position:fixed;z-index:70;left:0;top:0;padding:6px 10px;background:#fff;color:#4b5565;font-size:12px;line-height:16px;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px -10px rgba(16,24,40,.32);pointer-events:none;white-space:nowrap;opacity:0;visibility:hidden;transition:opacity .12s ease}
.move-tip.show{opacity:1;visibility:visible}
.arch-item button.del{color:var(--faint)}
.arch-item button.del:hover{color:var(--danger)}

/* ---------- menu / toast / ghost ---------- */
.menu{position:fixed;z-index:50;background:#fff;border-radius:11px;box-shadow:0 14px 36px -10px rgba(16,24,40,.3),0 0 0 1px var(--line);padding:6px;min-width:168px;max-height:60vh;overflow:auto}
.menu button{display:flex;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:13px;gap:8px;align-items:center;white-space:nowrap}
.menu button:hover{background:#f1f3f7}
.menu button.danger{color:var(--danger)}
.menu .sep{height:1px;background:var(--line);margin:4px 0}
.menu .mh{font-size:11px;color:var(--faint);padding:6px 10px 2px}
.menu .mi{width:8px;height:8px;border-radius:2px;display:inline-block}
.menu .mrow{display:flex;align-items:center;gap:4px;padding:4px 6px 6px}
.menu .mrow .mh2{font-size:11px;color:var(--faint);margin:0 4px 0 4px;white-space:nowrap}
.menu .mrow button{width:auto;flex:1;justify-content:center;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px}
.menu .mrow button.on{background:var(--accent-bg);border-color:transparent;color:var(--accent);font-weight:600}

/* ---------- confirm dialog ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:18vh 16px 16px}
.mask[hidden]{display:none}
.dlg{background:#fff;border-radius:14px;box-shadow:0 18px 48px -12px rgba(16,24,40,.3);width:min(380px,100%);padding:18px 18px 14px;position:relative}
.dlg .dlg-x{position:absolute;top:10px;right:10px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--faint);border-radius:7px}
.dlg .dlg-x:hover{background:#f1f3f7;color:var(--muted)}
.dlg .dlg-msg{font-size:14px;line-height:1.55;padding:2px 30px 0 2px;word-break:break-all}
.dlg .dlg-msg.is-title{font-size:16px;font-weight:700;line-height:26px;padding-top:0}   /* 属性设置等表单弹窗：标题样式 */
.dlg .dlg-input{display:block;width:100%;height:36px;margin-top:12px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:14px;background:#fff}
.dlg .dlg-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.dlg .dlg-input[hidden]{display:none}
.dlg .dlg-start{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.dlg .dlg-start[hidden]{display:none}
.dlg .dlg-start input{flex:1;min-width:150px;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:14px;background:#fff;font-family:inherit}
.dlg .dlg-start input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.dlg .dlg-seg{display:inline-flex;background:#f1f3f7;border-radius:9px;padding:3px}
.dlg .dlg-seg button{height:30px;padding:0 12px;border-radius:7px;font-size:13px;color:var(--muted)}
.dlg .dlg-seg button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.dlg .dlg-req{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.dlg .dlg-req[hidden]{display:none}
.dlg .rq-row{display:flex;flex-direction:column;gap:6px}
.dlg .rq-h{font-size:12.5px;font-weight:600;color:var(--muted)}
.dlg .rq-k button:disabled,.dlg .rq-p button:disabled{opacity:.35;cursor:not-allowed}
.dlg .rq-t{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dlg .rq-t[hidden]{display:none}
.dlg .rq-t input{flex:1;min-width:140px;height:34px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:14px;background:#fff;font-family:inherit}
.dlg .rq-t input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.dlg .rq-note{margin:0;font-size:12px;line-height:1.6;color:var(--faint)}
.dlg .rq-err{display:block;color:var(--danger);font-weight:500;margin-bottom:2px}
.dlg .st-note{margin-top:10px}
.dlg .st-note[hidden]{display:none}
.dlg .dlg-seg button:disabled{opacity:.35;cursor:not-allowed}
.dlg .btn-clear{background:#f1f3f7;color:var(--muted);margin-right:auto}
.dlg .btn-clear[hidden]{display:none}
.dlg .dlg-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dlg .dlg-btns button{height:32px;padding:0 16px;border-radius:8px;font-size:13px}
.dlg .btn-cancel{background:#f1f3f7;color:var(--muted)}
.dlg .btn-cancel:hover{color:var(--text);background:#e6eaf0}
.dlg .btn-ok{background:var(--accent);color:#fff}
.dlg .btn-ok:hover{filter:brightness(.95)}
.dlg .btn-ok:disabled{opacity:.45;cursor:not-allowed;filter:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2330;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:120;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
/* 拖动跟随物：.ghost 锚定在指尖（transform-origin 0 0），.gin 负责相对指尖的偏移与外观 */
.ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;will-change:transform;transform-origin:0 0}
.ghost .gin{background:#fff;border-radius:9px;box-shadow:0 14px 34px -10px rgba(16,24,40,.4)}
.ghost .gin>*{margin:0!important;opacity:1!important;outline:none!important}
/* 日历块：跟随物是该待办在这一天里的整体形状（克隆整格的 3 行，隐藏其它待办），投影沿形状轮廓 */
.ghost-cal .gin{background:none;border-radius:0;box-shadow:none;filter:drop-shadow(0 10px 16px rgba(16,24,40,.28)) drop-shadow(0 1px 3px rgba(16,24,40,.22));transition:transform .18s ease}
.ghost-cal .blk{cursor:grabbing}
body.dragging,body.dragging *{user-select:none!important;-webkit-user-select:none!important;cursor:grabbing!important}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(47,111,237,.65)}100%{box-shadow:0 0 0 9px rgba(47,111,237,0)}}
.flash{animation:flash .8s ease-out 2}

/* ---------- responsive ---------- */
#calPanel{container-type:inline-size;container-name:calendar}
@container calendar (max-width:745px){
  .legend{display:none}
}
@container calendar (max-width:445px){
  .cal-actions{margin-left:10px}   /* 换行后保持同步按钮原有的左侧位置 */
}
@container calendar (max-width:380px){
  .cal-hint{white-space:normal}
  .cal-hint-part{display:block;white-space:nowrap}
  .cal-hint-sep{display:none}
}
@media (max-width:1260px){
  .layout{display:block;height:auto;padding:10px}
  .panel{margin-bottom:12px}
  .panel-body{overflow:visible;padding:10px}
  .panel-head{position:sticky;top:48px;z-index:10;background:#fff;border-radius:var(--radius) var(--radius) 0 0}
  .top{height:48px;padding:0 14px}
  .stats{font-size:12px;gap:10px}
}
@media (max-width:1260px){ #listPanel .panel-head{position:sticky} }   /* 抵消 #listPanel .panel-head{position:relative}（hn-tip 锚定用），保持原有吸顶行为 */
@media (max-width:640px){
  .brand-txt{display:none}
  .brand-txt-m{display:inline}   /* 手机版：仍显示原来的短标题 */
  :root{--slot-h:19px}
  .grid,.weekdays{gap:3px}
  .day{padding:3px;border-radius:8px;gap:2px}
  .dhead{flex-wrap:wrap;height:auto;min-height:18px}
  .num{width:18px;height:18px;line-height:18px;font-size:11px}
  .fest{flex:1 0 100%;line-height:12px;font-size:9px;height:12px}
  .blk{--r:5px;font-size:9.5px;padding:0 2px;text-overflow:clip}
  .blk .btx{text-overflow:clip}
  .blk svg{display:none}
  /* 615–640px 与手机待办条目统一，避免菜单与纵向上下移按钮重叠 */
  .todo{grid-template-columns:26px minmax(0,1fr) 34px;grid-template-areas:"c b m" "c k m";padding:10px 6px 10px 10px;gap:8px}
  .check{width:24px;height:24px;border-radius:7px}
  .check svg{width:14px;height:14px}
  .ctrls{margin-top:4px;justify-self:stretch;flex-wrap:wrap;grid-column:2/4;gap:8px}
  .ctrls .sw,.ctrls .arch-btn{margin-left:12px}
  .sw,.arch-btn{padding:0 5px;height:28px;font-size:11.5px}
  .est{height:28px}
  .est small{display:none}
  .est button{width:21px;height:28px;font-size:16px;display:flex;align-items:center;justify-content:center}
  .est .val{position:relative;z-index:1;align-self:stretch;min-width:33px;margin:0 -5px;padding:0 5px;font-size:12.5px}   /* 文字区与整枚按钮比上一档窄 2px；点击区仍向两侧各盖住加减内侧 5px */
  /* 属性里的已完成：窄屏高度与列表预估按钮一致，「半天」仍保留 */
  #dlgDnRow .est{height:28px}
  #dlgDnRow .est small{display:inline}
  #dlgDnRow .est button{width:24px;height:28px;font-size:15px}

  if (stuck.length) html += `<div class="section stuck"><div class="sec-h warn">排不下<span class="cnt">${stuck.length}</span></div>${stuck.map(t => insAt(t, 'before') + todoHtml(t, { drag: false }) + insAt(t, 'after')).join('')}</div>`;
  html += '<div class="sched-section">';
  let lastDay = null;
  for (const sg of layout.segs) {   // 跨天的待办每天一段，标注 1/3、2/3…
    if (sg.d !== lastDay) { lastDay = sg.d; html += `<div class="day-sep${lastDay === now.d ? ' today' : ''}">${dayLabel(lastDay, now)}</div>`; }
    const st = itemById(sg.id);
    if (st.void) { html += voidHtml(st, sg); continue; }
    if (st.virtual) { html += todoHtml(st, { seg: sg }); continue; }
    html += (sg.idx === 0 ? insAt(st, 'before') : '') + todoHtml(st, { dragKind: layout.fixed.has(st.id) ? '' : 'sched', seg: sg }) + (sg.idx === sg.n - 1 ? insAt(st, 'after') : '');
  }
  html += '</div>';
  const unsched = state.todos.filter(t => isActive(t) && !t.sched).sort(groupOrderCmp);
  if (unsched.length) html += `<div class="section"><div class="sec-h">未排期<span class="cnt">${unsched.length}</span></div>${unsched.map(t => insAt(t, 'before') + todoHtml(t, { drag: false }) + insAt(t, 'after')).join('')}</div>`;
  const done = state.todos.filter(t => t.done && !t.archived);
  if (done.length) html += `<div class="section"><div class="sec-h">已完成<span class="cnt">${done.length}</span><span class="sp"></span><button data-act="archive-all">全部归档</button></div>${done.map(t => insAt(t, 'before') + todoHtml(t, { drag: false }) + insAt(t, 'after')).join('')}</div>`;
  return html + archivedHtml();
}
function renderGroupView() {
  let html = '';
  for (const c of CATS) {
    const groups = state.groups.filter(g => g.cat === c.id);
    const catTodos = state.todos.filter(t => isActive(t) && catOf(t) === c.id);
    html += `<section class="cat cat-${c.id}" data-cat="${c.id}"><div class="cat-h"><span class="dot"></span><h3>${c.name}</h3><span class="cnt">${catTodos.length} 项待完成 · ${fmtEst(sumEst(catTodos))} 半天</span></div>`;
    if (!groups.length) html += '<div class="empty-hint" style="margin-bottom:8px">还没有分组</div>';
    for (const g of groups) {
      const ts = state.todos.filter(t => t.groupId === g.id && !t.archived), un = ts.filter(t => !t.done).length;
      const folded = !!(state.collapsed && state.collapsed[g.id]);
      html += `<div class="group${state.dragId === g.id ? ' drag-src' : ''}" data-gid="${g.id}"><div class="g-h"><button class="g-fold${folded ? ' folded' : ''}" data-act="g-fold" data-id="${g.id}" aria-label="${folded ? '展开' : '折叠'}">${I.chev}</button><span class="gname" data-act="edit-group" data-id="${g.id}">${esc(g.name)}</span><span class="cnt" title="待完成/全部 · 剩余预估">${un}/${ts.length}${un ? ' · ' + fmtEst(sumEst(ts)) + ' 半天' : ''}</span><span class="sp"></span><button class="more" data-act="gmenu" data-id="${g.id}" aria-label="分组操作">${I.more}</button></div>`;
      if (!folded) {
        for (const t of ts) html += insAt(t, 'before') + todoHtml(t, { dragKind: 'gtodo' }) + insAt(t, 'after');
        html += `<div class="addrow" data-gid="${g.id}"><input id="add-${g.id}" data-gid="${g.id}" placeholder="添加待办…" enterkeyhint="done" autocomplete="off"><button data-act="add" data-gid="${g.id}">添加</button><button data-act="add-rest" data-gid="${g.id}" title="添加一段休息">${I.rest}休息</button><button data-act="add-other" data-gid="${g.id}" title="添加一条「其他」">其他</button></div>`;
      }
      html += '</div>';
    }
    html += state.addingGroup === c.id
      ? `<div class="addrow"><input id="addg-${c.id}" data-cat="${c.id}" placeholder="新分组名称" enterkeyhint="done" autocomplete="off"><button class="primary" data-act="add-group-ok" data-cat="${c.id}">创建</button><button data-act="add-group-cancel">取消</button></div>`
      : `<button class="add-group" data-act="add-group" data-cat="${c.id}">+ 新建分组</button>`;
    html += '</section>';
  }
  return html + archivedHtml();
}

  return { key: ins.pos + ':' + (ins.id || '') + ':' + slotKey(ins.nb), apply: () => dragApply(a, ins, false) };
}
function gtodoTarget(el, y, a) {
  const item = el.closest('.todo');
  if (item) {
    if (item.dataset.id === a.id || !item.closest('.group')) return null;
    const r = item.getBoundingClientRect(), before = y < r.top + r.height / 2;
    return { key: (before ? 'b:' : 'a:') + item.dataset.id, apply: () => moveTodoRelative(a.id, item.dataset.id, before) };
  }
  const grp = el.closest('.group');
  if (grp) { const head = !!el.closest('.g-h'); return { key: (head ? 'gs:' : 'ge:') + grp.dataset.gid, apply: () => moveTodoToGroup(a.id, grp.dataset.gid, head ? 'start' : 'end') }; }
  return null;
}
/* 归档排序独立于活动待办顺序；只在同一分组内调整，之后新归档的仍置顶。 */
function moveArchivedRelative(dragId, targetId, before) {

  const original = items.map(t => t.id).join(',');
  items.splice(items.indexOf(d), 1);
  items.splice(items.indexOf(target) + (before ? 0 : 1), 0, d);
  if (original === items.map(t => t.id).join(',')) return false;
  const top = state.todos.reduce((m, t) => t.archived && Number.isFinite(t.ao) ? Math.max(m, t.ao) : m, 0) + items.length;
  items.forEach((t, i) => { t.ao = top - i; });

}
function archiveTarget(el, y, a) {
  const item = el.closest('.arch-item[data-drag="archive"]');

  const d = todoById(a.id), target = todoById(item.dataset.id);
  if (!d || !target || d.groupId !== target.groupId) return null;
  const r = item.getBoundingClientRect(), before = y < r.top + r.height / 2;

function groupTarget(el, y, a) {
  const grp = el.closest('.group'); if (!grp || grp.dataset.gid === a.id) return null;
  const g = groupById(a.id), tg = groupById(grp.dataset.gid); if (!g || !tg || tg.cat !== g.cat) return null;
  const r = grp.getBoundingClientRect(), before = y < r.top + r.height / 2;
  return { key: (before ? 'b:' : 'a:') + tg.id, apply: () => { const arr = state.groups, from = arr.indexOf(g); arr.splice(from, 1); let to = arr.indexOf(tg); if (!before) to++; arr.splice(to, 0, g); return from !== to; } };

function endDrag(cancel) {
  const a = DND.act; if (!a) return;

  try { document.body.releasePointerCapture(a.pointerId); } catch (err) { }

  if (a.tm) a.tmEl.removeEventListener('touchmove', a.tm);
  if (!cancel) {   // 拖动跨过时段边界时先结算原排期，再保留用户的落点
    rollTime();
    const dt = todoById(a.id);
    if (dt && (a.kind === 'cal' || a.kind === 'sched')) dt.st = null;
  }
  if (cancel) { state.schedOrder = a.origOrder; state.todos = a.origTodos; state.groups = a.origGroups; for (const t of state.todos) { if (a.origGroupIds[t.id]) t.groupId = a.origGroupIds[t.id]; t.ao = a.origArchiveOrder[t.id]; } const dt = todoById(a.id); if (dt) { dt.nb = a.origNb; dt.st = a.origSt; } }
  else if (a.kind === 'gtodo') {   // 拖到另一类分组、换了时间线：进行中的从头重新排
    const dt = todoById(a.id), og = groupById(a.origGroupIds[a.id]);
    if (dt && og && (og.cat === 'work') !== (catOf(dt) === 'work')) dt.st = null;
  }
  else if (a.kind === 'cal' || a.kind === 'sched') {   // 松手时再核对一次：空档落成「其他」后，被拖的待办必须还在松手时看到的位置
    const pre = (computeLayout().spans.get(a.id) || {}).start, snap = snapSched();
    materializeFillers();
    const post = (computeLayout().spans.get(a.id) || {}).start;
    if (slotKey(pre) !== slotKey(post)) {
      restoreSched(snap); state.schedOrder = a.origOrder.filter(id => todoById(id));
      const dt = todoById(a.id); if (dt) { dt.nb = a.origNb; dt.st = a.origSt; }
      toast('这个位置落定后排不下，已撤回这次拖动', 3000);
    }
  }

  commit();
}

/* ================= boot ================= */
if (rollTime()) save();   // 旧数据先结算并保存初始化记录，再处理残留的指定起始时间
if (materializeFillers()) save();   // 旧数据里残留的起始时间约束 → 落成真实的「其他」
/* 信息按钮「i」字体自适应定位：Palatino 与回退字体（Georgia/Noto）字形结构不同，位置分别用实测校准值（Palatino: x12.2/y16.6；回退: x11.92/y17.17） */
{
  const t = document.querySelector('.cal-info-letter');
  if (t) {
    const c = document.createElement('canvas').getContext('2d'), s = 'iiWWmm13';
    const w = f => { c.font = '700 14px ' + f; return c.measureText(s).width; };
    let hasPalatino = true;
    try { hasPalatino = w('"Palatino Linotype", monospace') !== w('monospace') && w('"Palatino Linotype", monospace') !== w('serif'); } catch (e) { }
    if (!hasPalatino) { t.setAttribute('x', '11.92'); t.setAttribute('y', '17.17'); }
  }
}
render();
cloudBoot();
/* 顶部提示语：≥2 行加 hn-multi（右缘多留 5px），被 clamp 截断加 hn-clip（可悬停/点按看全文）；随文本变化同步重判 */
{
  const hn = document.getElementById('headNote');
  if (hn && typeof ResizeObserver === 'function') {
    const applyHnState = () => {
      hn.classList.toggle('hn-multi', hn.offsetHeight > 20);
      hn.classList.toggle('hn-clip', hn.scrollHeight > hn.clientHeight + 1);
    };
    new ResizeObserver(applyHnState).observe(hn);
    if (typeof MutationObserver === 'function') new MutationObserver(applyHnState).observe(hn, { childList: true, characterData: true });
    applyHnState();
  }
}
function closeHnTip() {   // 提示语完整气泡的关闭（同信息按钮 i 的关闭方式）
  const hn = document.getElementById('headNote');
  if (!hn || !hn.classList.contains('is-open')) return;
  hn.classList.remove('is-open');
  hn.setAttribute('aria-expanded', 'false');
  hn.blur();
}
function actHnTip(btn, e) {   // 截断时：手机点一下显示完整文案、再点一下取消（桌面悬停显示；同信息按钮 i 的交互约定）
  const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (!btn.classList.contains('hn-clip')) { closeHnTip(); return; }
  if (!canHover || e.detail === 0) {
    const open = btn.classList.toggle('is-open');
    btn.setAttribute('aria-expanded', String(open));
    if (!open && !canHover) btn.blur();
  }
}
const closeHnTipIfDesktop = () => { if (window.matchMedia('(hover: hover) and (pointer: fine)').matches || window.innerWidth > 1260) closeHnTip(); };
window.addEventListener('resize', closeHnTipIfDesktop);
setInterval(() => { const n = nowInfo(); if (n.d + n.s !== lastNowKey && !DND.act) render(); }, 30000);
setInterval(pullCloud, 500);   // 非改动状态每 0.5 秒读一次云端；改动状态里 pullCloud 直接返回
document.addEventListener('visibilitychange', () => { if (document.hidden) flushCloudSync(); else { if (!DND.act) render(); pullCloud(); } });
window.addEventListener('focus', pullCloud);
window.addEventListener('pageshow', pullCloud);
window.addEventListener('pagehide', flushCloudSync);
window.addEventListener('beforeunload', flushCloudSync);
try { localStorage.removeItem(STORE_KEY + '-dirty'); } catch (e) { }   // 清掉旧规则留下的「下次用本地盖云端」标记
})();
